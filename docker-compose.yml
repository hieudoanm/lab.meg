name: meg-lab

services:
  postgres:
    container_name: meg-lab-postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: meglab
      POSTGRES_PASSWORD: meglab
      POSTGRES_DB: meglab
    ports:
      - '5433:5432'
    volumes:
      - meg-lab-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U meglab -d meglab']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    container_name: meg-lab-redis
    image: redis:8-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    container_name: meg-lab-minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: meglab
      MINIO_ROOT_PASSWORD: meglabminio123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - meg-lab-minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    container_name: meg-lab-minio-init
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 meglab meglabminio123 &&
             mc mb --ignore-existing local/meglab"

  migrate:
    container_name: meg-lab-migrate
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    command: ['python', '-m', 'app.db.migrate']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MEG_DATABASE_URL: postgresql+psycopg://meglab:meglab@postgres:5432/meglab
    restart: 'no'

  api:
    container_name: meg-lab-api
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    command: ['uvicorn', 'app.main:app', '--host', '0.0.0.0', '--port', '8000']
    ports:
      - '8001:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      MEG_APP_ENV: development
      MEG_AUTH_MODE: development
      MEG_DATABASE_URL: postgresql+psycopg://meglab:meglab@postgres:5432/meglab
      MEG_REDIS_URL: redis://redis:6379/0
      MEG_STORAGE_BACKEND: s3
      MEG_S3_ENDPOINT: http://minio:9000
      MEG_S3_BUCKET: meglab
      MEG_S3_ACCESS_KEY: meglab
      MEG_S3_SECRET_KEY: meglabminio123
      MEG_PUBLIC_BASE_URL: http://localhost:8001
      MEG_SESSION_SECRET: dev-session-secret-change-me
      MEG_JWT_SECRET: dev-jwt-secret-change-me
      MEG_MNE_WORKER_IMAGE: meg-lab-mne:0.1.0
    restart: unless-stopped

  worker:
    container_name: meg-lab-worker
    build:
      context: ./packages/backend
      dockerfile: Dockerfile.mne
    command:
      [
        'celery',
        '-A',
        'workers.celery_app',
        'worker',
        '--loglevel=INFO',
        '--concurrency',
        '2'
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      MEG_APP_ENV: development
      MEG_AUTH_MODE: development
      MEG_DATABASE_URL: postgresql+psycopg://meglab:meglab@postgres:5432/meglab
      MEG_REDIS_URL: redis://redis:6379/0
      MEG_STORAGE_BACKEND: s3
      MEG_S3_ENDPOINT: http://minio:9000
      MEG_S3_BUCKET: meglab
      MEG_S3_ACCESS_KEY: meglab
      MEG_S3_SECRET_KEY: meglabminio123
      MEG_SESSION_SECRET: dev-session-secret-change-me
      MEG_JWT_SECRET: dev-jwt-secret-change-me
      MEG_MNE_WORKER_IMAGE: meg-lab-mne:0.1.0
    restart: unless-stopped

  dispatcher:
    container_name: meg-lab-dispatcher
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    command: ['python', '-m', 'workers.dispatcher']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      MEG_APP_ENV: development
      MEG_DATABASE_URL: postgresql+psycopg://meglab:meglab@postgres:5432/meglab
      MEG_REDIS_URL: redis://redis:6379/0
      MEG_SESSION_SECRET: dev-session-secret-change-me
      MEG_JWT_SECRET: dev-jwt-secret-change-me
    init: true
    restart: unless-stopped

volumes:
  meg-lab-pgdata:
  meg-lab-minio:
