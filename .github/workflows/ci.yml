name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: '3.15.0'
  NODE_VERSION_FILE: packages/frontend/.nvmrc

jobs:
  backend:
    name: CI - Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend
    env:
      MEG_DATABASE_URL: postgresql://meglab:meglab@localhost:5432/meglab
      APP_ENV: test
      AUTH_MODE: development
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: meglab
          POSTGRES_PASSWORD: meglab
          POSTGRES_DB: meglab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meglab -d meglab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.13.5'
          python-version: '${{ env.UV_PYTHON }}'
          enable-cache: true
          cache-dependency-glob: packages/backend/uv.lock

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run python -m mypy .

      - name: Apply migrations
        run: uv run python -m app.db.migrate

      - name: Pytest
        run: uv run pytest -q --cov=app --cov-report=term-missing

      - name: Python dependency audit
        run: uv run pip-audit --desc --format=json --output=pip-audit.json || true
      - name: Upload pip-audit results
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pip-audit-results
          path: packages/backend/pip-audit.json
          retention-days: 30

  frontend:
    name: CI - Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Enable pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.14.0

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '${{ env.NODE_VERSION_FILE }}'

      - name: Cache pnpm store
        uses: actions/cache@v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint && pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Node dependency audit
        run: pnpm audit --json --output=npm-audit.json || true
      - name: Upload npm audit results
        uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-audit-results
          path: packages/frontend/npm-audit.json
          retention-days: 30

  e2e:
    name: End-to-End
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: packages/frontend
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Enable pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.14.0

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '${{ env.NODE_VERSION_FILE }}'

      - name: Cache pnpm store
        uses: actions/cache@v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright smoke tests
        run: pnpm test:e2e

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: 'trivy-results.sarif'

  tauri-build:
    name: Build Tauri (${{ matrix.os }})
    needs: [backend, frontend, e2e, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust-targets: 'x86_64-apple-darwin,aarch64-apple-darwin'
            system-deps: ''
            zip-app: true
          - os: ubuntu-latest
            rust-targets: 'x86_64-unknown-linux-gnu'
            system-deps: |
              sudo apt-get update
              sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
            zip-app: false
          - os: windows-latest
            rust-targets: 'x86_64-pc-windows-msvc'
            system-deps: ''
            zip-app: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Enable pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.14.0

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '${{ env.NODE_VERSION_FILE }}'

      - name: Cache pnpm store
        uses: actions/cache@v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install frontend dependencies
        working-directory: packages/frontend
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workdir: packages/frontend/src-tauri

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: ${{ matrix.system-deps }}

      - name: Build Tauri application
        working-directory: packages/frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PASSWORD }}
        run: |
          pnpm tauri:build

      - name: Zip App Bundle for macOS
        if: matrix.zip-app
        working-directory: packages/frontend/src-tauri/target/release/bundle/macos
        run: |
          shopt -s nullglob
          for app in *.app; do
            zip -r -y "${app}.zip" "$app"
          done

      - name: Set Date
        id: date
        run: echo "value=$(date +'%Y_%m_%d')" >> "$GITHUB_OUTPUT"

      - name: Upload Tauri Artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mri-lab_desktop_${{ matrix.os }}-${{ steps.date.outputs.value }}
          path: packages/frontend/src-tauri/target/release/bundle/
          retention-days: 7

  tauri-release:
    name: Publish Tauri Release
    needs: [tauri-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts

      - name: Collect Release Artifacts
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            find "$dir" -type f \( \
              -name "*.AppImage" -o \
              -name "*.deb" -o \
              -name "*.rpm" -o \
              -name "*.dmg" -o \
              -name "*.zip" -o \
              -name "*.tar.xz" -o \
              -name "*.msi" -o \
              -name "*.exe" \
            \) ! -name "*control.tar.gz" ! -name "*data.tar.gz" -print0 |
              while IFS= read -r -d '' file; do
                cp "$file" release/
              done
          done
          for file in release/*; do
            base="$(basename "$file")"
            ext="${base##*.}"
            target="mri-lab.$ext"
            if [[ "$base" != "$target" ]]; then
              mv "$file" "release/$target"
            fi
          done
          cd release
          for file in ./*; do
            if [[ "$file" != "./SHA256SUMS.txt" ]]; then
              sha256sum --binary "${file#./}"
            fi
          done > SHA256SUMS.txt
          sha256sum --check --quiet SHA256SUMS.txt

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_NAME="latest"
          RELEASE_TITLE="MEG Lab Latest"
          RELEASE_NOTES="release-notes.md"
          {
            echo "Auto-built from commit ${{ github.sha }}"
            echo ""
            echo "---"
            echo ""
            cat RELEASE.md
          } > "$RELEASE_NOTES"
          mapfile -d '' -t files < <(find release -type f -print0 | sort -z)
          gh release delete "$RELEASE_NAME" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_NAME" \
            --title "$RELEASE_TITLE" \
            --notes-file "$RELEASE_NOTES" \
            "${files[@]}"
