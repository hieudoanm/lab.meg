name: meg-lab

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: meglab
      POSTGRES_PASSWORD: meglab
      POSTGRES_DB: meglab
    ports:
      - "5433:5432"
    volumes:
      - meg-lab-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meglab -d meglab"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Use local file storage instead of minio for demo
  api:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      MEG_APP_ENV: development
      MEG_AUTH_MODE: development
      MEG_DATABASE_URL: postgresql://meglab:meglab@postgres:5432/meglab
      MEG_REDIS_URL: redis://redis:6379/0
      MEG_STORAGE_BACKEND: file
      MEG_STORAGE_DATA_DIR: /data/storage
      MEG_PUBLIC_BASE_URL: http://localhost:8000
      MEG_SESSION_SECRET: dev-session-secret-change-me
      MEG_JWT_SECRET: dev-jwt-secret-change-me
      MEG_MNE_WORKER_IMAGE: meg-lab-mne:0.1.0
    volumes:
      - meg-lab-storage:/data/storage

  worker:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile.mne
    command: ["uv", "run", "celery", "-A", "workers.celery_app", "worker", "--loglevel=INFO", "--concurrency", "2"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      MEG_APP_ENV: development
      MEG_AUTH_MODE: development
      MEG_DATABASE_URL: postgresql://meglab:meglab@postgres:5432/meglab
      MEG_REDIS_URL: redis://redis:6379/0
      MEG_STORAGE_BACKEND: file
      MEG_STORAGE_DATA_DIR: /data/storage
      MEG_SESSION_SECRET: dev-session-secret-change-me
      MEG_JWT_SECRET: dev-jwt-secret-change-me
      MEG_MNE_WORKER_IMAGE: meg-lab-mne:0.1.0
    volumes:
      - meg-lab-storage:/data/storage

  dispatcher:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    command: ["uv", "run", "python", "-m", "workers.dispatcher"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      MEG_APP_ENV: development
      MEG_DATABASE_URL: postgresql://meglab:meglab@postgres:5432/meglab
      MEG_REDIS_URL: redis://redis:6379/0
      MEG_SESSION_SECRET: dev-session-secret-change-me
      MEG_JWT_SECRET: dev-jwt-secret-change-me

  migrate:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    command: ["uv", "run", "python", "-m", "app.db.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MEG_DATABASE_URL: postgresql://meglab:meglab@postgres:5432/meglab

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    command: ["node", "packages/frontend/server.js"]
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      API_INTERNAL_BASE_URL: http://api:8000/api/v1

volumes:
  meg-lab-pgdata:
  meg-lab-storage: