[package]
name = "meg-lab"
version = "0.1.0"
description = "MEG Lab - project-scoped computational electrophysiology platform"
authors = ["MEG Lab Contributors"]
license = "MIT"
repository = "https://github.com/hieudoanm/meg-lab"
edition = "2024"
rust-version = "1.90"

[lib]
name = "meg_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
