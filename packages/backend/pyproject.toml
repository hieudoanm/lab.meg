[project]
name = "meg-lab-backend"
version = "0.1.0"
description = "MEG Lab backend: project-scoped MEG data management, sensor geometry, pipelines, and reproducible experiment runs."
requires-python = "==3.15.1"
dependencies = [
    "fastapi==0.159.1",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "psycopg[binary,pool]==3.3.6",
    "celery==5.6.3",
    "redis==8.1.0",
    "boto3==1.43.117",
    "argon2-cffi==25.1.0",
    "pyjwt==2.15.1",
    "jsonschema==4.26.0",
    "mne==1.13.2",
    "numpy==2.5.4",
]

[project.optional-dependencies]
bids = ["mne-bids==0.20.0"]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.2",
    "mypy==2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "workers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]

[tool.mypy]
python_version = "3.15"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.2",
    "mypy==2.4.0",
    "pytest-cov==7.1.0",
]
