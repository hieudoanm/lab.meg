[project]
name = "meg-lab-backend"
version = "0.1.0"
description = "MEG Lab backend: project-scoped MEG data management, sensor geometry, pipelines, and reproducible experiment runs."
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "celery>=5.4,<6",
    "redis>=5.2,<6",
    "boto3>=1.35,<2",
    "argon2-cffi>=23.1,<24",
    "pyjwt>=2.9,<3",
    "jsonschema>=4.23,<5",
    "mne>=1.8,<2",
    "numpy>=2.0,<3",
]

[project.optional-dependencies]
bids = ["mne-bids>=0.13,<0.14"]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "ruff>=0.7,<0.9",
    "mypy>=1.13,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "workers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
